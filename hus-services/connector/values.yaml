env:
  - name: CHUNK_SIZE
    value: "8192" # 8KB chunks
  - name: MAX_FILE_SIZE
    value: "10737418240"  # 10GB
  - name: MAX_FILES_TO_LIST
    value: "10"  # Limit for number of files to list in directory listings
  - name: FS_BASE_PATH
    value: "/data" # Base path for file system operations
  - name : LOG_LEVEL
    value: "INFO"
  - name: S3_BUCKET_NAME
    value: "connector-testing-data"
  - name: S3_REGION
    value: "us-east-1"
  - name: S3_PREFIX
    value: "data/"
  - name: S3_ENDPOINT_URL
    value: "http://mlflow-minio.kubeflow.svc.cluster.local:9000"

# The chart default (limit 128Mi) gets the connector OOM-killed: opening "Add
# New Item" in the portal lists the S3 data products (several parallel
# /dataproducts/s3 calls) and the pod died with exit 137 twice on 3 Nov 2026
# (09:19 and 09:25). It idles at ~84Mi. Same shape as clearing-house.
# The HUS node's memory requests are at ~88%; this adds 64Mi to them.
resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  host: nextgen.hiro-develop.nl
  
nodeSelector:
  role: hus
  
namespace: hus