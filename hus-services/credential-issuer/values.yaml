# HUS credential-issuer deploy.
# Mints ACDCs bound to subject AIDs and wraps them as IPEX grants that
# ds-login's AcdcVerifier reads under the open-federation model.

image:
  # Pinned to a specific SHA-stamped tag published by ds-credential-issuer
  # CI (format: <appVersion>-dev.<run>.<branch>.<short-sha>). Matches how
  # every other ds-* service pins its image and lets us use IfNotPresent,
  # so pod restarts hit the local containerd cache instead of ghcr's
  # anonymous token endpoint (which rate-limits the cluster egress IP).
  tag: "0.1.0-dev.30.develop.cdf8d567"
  pullPolicy: IfNotPresent

# Per-service ingress alongside the gateway route. Easier to hit directly
# during initial testing; gateway route (/credential-issuer/*) remains for
# consistent Hiro-internal access.
# Requires chart 0.1.1+ which added annotations support for cert-manager.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ds-credential-issuer.hus.nextgen.hiro-develop.nl
  tls:
    enabled: true
    secretName: ds-credential-issuer-tls-secret

issuer:
  # Habitat alias — becomes the KERIpy habery name on first boot.
  name: hus-issuer

  # Where KERIpy stores the LMDB keystore. The PVC below mounts here.
  haberyPath: /var/lib/ds-credential-issuer/keystore

  # Point the issuer at HUS's own DKMS stack. In-cluster Service DNS —
  # these match ds-dkms chart Service names in the hus namespace.
  witnessUrls:
    - http://ds-dkms-witness:3232

  # AIDs of those witnesses (positionally matched to witnessUrls).
  # KERIpy's makeHab(wits=...) wants AIDs, not URLs — without this the
  # issuer is minted self-sovereign (wits=[]) and no witness ever stores
  # its KEL, so verifiers cannot resolve the issuer's OOBI.
  witnessAids:
    - BJq7UABlttINuWJh1Xl2lkqZG4NTdUdqnbFJDa6ZyxCC   # hus witness AID

  # Externally-reachable base URL(s) per witness. The chart composes the
  # ISSUER's own OOBI as "{base}/oobi/{issuerAid}" at grant time, so
  # verifiers outside the cluster can resolve the issuer's live KEL.
  # Leave empty to fall back to witnessUrls (in-cluster-only resolution,
  # fine for intra-site verifiers).
  witnessOobiBases:
    - https://dkms-witness-1.hus.nextgen.hiro-develop.nl

  # DEPRECATED. Explicit pre-computed OOBIs — only use when the OOBI
  # endpoint shape differs from the default keriox /oobi/<AID> pattern.
  witnessOobis: []

  mesagkestoUrl: http://ds-dkms-mesagkesto:8081
  inceptionThreshold: 1

persistence:
  enabled: true
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 2Gi
  mountPath: /var/lib/ds-credential-issuer

env:
  DS__ENVIRONMENT: production
  DS__LOG_LEVEL: INFO
  # Database for the schema registry (local sqlite inside the PVC).
  DS__DATABASE_URL: "sqlite+aiosqlite:////var/lib/ds-credential-issuer/schemas.db"

# ds-auth middleware — gated by DS__AUTH__ENABLED. Enable once ds-login
# is deployed and issuing JWTs that this service's permission checks can
# consume. Mutations require issuer:write, admin requires issuer:admin.
auth:
  enabled: true
  # Clean Service name after ds-login chart 0.1.4 fixed the release-name
  # doubling in its fullname helper.
  jwksUrl: http://ds-login:8080/.well-known/jwks.json
  policyEngineUrl: http://ds-policy-engine:8000

nodeSelector:
  role: hus
