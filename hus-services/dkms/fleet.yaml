defaultNamespace: hus
helm:
  repo: https://hiro-microdatacenters-bv.github.io/ds-dkms
  chart: ds-dkms
  releaseName: ds-dkms
  version: 0.1.4
  valuesFiles:
    - values.yaml
  # Per-site KERI seeds for witness, watcher and mesagkesto. The Secret holds a
  # Helm values file; it never appears in this public repo in plaintext. It
  # must exist in the cluster before this bundle deploys (see SEEDS.md).
  valuesFrom:
    - secretKeyRef:
        name: dkms-seeds
        namespace: hus
        key: values.yaml
