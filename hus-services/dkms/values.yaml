# HUS single-site DKMS deploy.
#
# Shape for M36 December 2026 demo: 1 witness + 1 watcher + mesagkesto in
# the hus namespace at *.hus.nextgen.hiro-develop.nl. Scale witnesses up
# (and rotate every AID) when we federate beyond HUS.
#
# Seeds: NOT in this file (this repo is public). witness.seed, watcher.seed
# and mesagkesto.seed come from the Secret hus/dkms-seeds through
# helm.valuesFrom in fleet.yaml — see SEEDS.md.

baseDomain: hus.nextgen.hiro-develop.nl

# keriox 0.17.13 rejects `https` in the three `public_url` fields with
# "Unsupported scheme https" — it only accepts http (TLS is terminated at
# ingress). Override the chart's default `https://` pattern here. These
# URLs are what gets embedded in the OOBIs the witness/watcher advertise;
# consumers reach them via the ingress and the TLS layer stops at
# nginx — the keriox pod itself speaks plain HTTP.
witness:
  enabled: true
  replicaCount: 1
  # Public address, so users' wallets outside the cluster can create and
  # rotate identities at this witness (ds-login only accepts identities on it).
  # Plain http: keriox rejects https here; KELs are public and signed, so http
  # loses privacy, not integrity. In-cluster callers (issuer, ds-login) keep
  # using the Service URL http://ds-dkms-witness:3232.
  publicUrlPattern: "http://dkms-witness-{idx}.hus.nextgen.hiro-develop.nl"
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  # Ingress host is derived from publicUrlPattern (dkms-witness-1.hus...).
  # ssl-redirect off: the advertised address is http, and a redirect to https
  # would break keriox clients. https still works for callers that use it.
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    tls:
      enabled: true
      secretNamePattern: "dkms-witness-{idx}-tls"
  nodeSelector:
    role: hus

watcher:
  enabled: true
  # In-cluster URL so mesagkesto's /register call (which the watcher
  # advertises in its own OOBI reply) stays inside the cluster and
  # doesn't bounce through the nginx HTTP→HTTPS redirect, where the
  # pod has no LE chain and TLS fails.
  publicUrl: "http://ds-dkms-watcher:3235"
  # Replaced after first boot: once the witness's AID is known the
  # operator records its OOBI here so the watcher subscribes on restart.
  initialOobis: []
  persistence:
    enabled: true
    size: 1Gi
  # Watcher ingress is DISABLED here because the chart derives the Ingress
  # host from watcher.publicUrl by stripping the scheme — and our in-cluster
  # URL ds-dkms-watcher:3235 produces an invalid host (contains a port) that
  # Kubernetes rejects, failing the whole DKMS Helm render (ErrApplied on
  # the Fleet bundle).
  # Nothing outside the cluster needs to reach the watcher — mesagkesto and
  # ds-login resolve it via the in-cluster Service name. Re-enable only
  # after the chart separates publicUrl (OOBI content) from ingress.host
  # (routing) — tracked for a ds-dkms chart fix.
  ingress:
    enabled: false
  nodeSelector:
    role: hus

mesagkesto:
  enabled: true
  publicUrl: "http://dkms-mesagkesto.hus.nextgen.hiro-develop.nl"
  # Real watcher OOBI (eid = watcher's AID). Captured from the hus
  # watcher at first boot — if the watcher is ever re-seeded with a new
  # AID (rare) this needs to be rotated to match.
  # Re-keyed 2026-10-28: watcher AID from the per-site seeds (dkms-seeds).
  # Use the in-cluster
  # service URL so mesagkesto bypasses the ingress HTTP→HTTPS redirect
  # (the pod has no Let's Encrypt chain, so a round-trip via the public
  # hostname fails on 'unable to get local issuer certificate').
  watcherOobi: '{"eid":"BKv5EaiXBWHdjR1vJutuLbBixtLxpdWD3SD5GjlL3mpX","scheme":"http","url":"http://ds-dkms-watcher:3235/"}'
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      secretName: dkms-mesagkesto-tls
  nodeSelector:
    role: hus
