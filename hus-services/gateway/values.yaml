ingress:
  host: nextgen.hiro-develop.nl

nodeSelector:
  role: hus

namespace: hus

## APISIX Configuration
config:
  apisixConfig: |
    apisix:
      node_listen: 9080
      enable_heartbeat: false
      enable_admin: false
      enable_admin_cors: false
      enable_debug: false
      enable_dev_mode: false
      enable_reuseport: true
      enable_ipv6: true
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
    ext-plugin:
      path_for_test: "/tmp/runner.sock"
    #END

  routesConfig: |
    routes:
      - id: 1
        methods:
          - GET
        uri: "/health"
        name: "health-check"
        plugins:
          proxy-rewrite:
            uri: "/status/200"
        upstream:
          type: roundrobin
          scheme: https
          nodes:
            "httpbin.org:443": 1

      - id: 2
        uri: "/anything/*"
        methods:
          - GET
          - POST
        upstream:
          type: roundrobin
          scheme: https
          nodes:
            "httpbin.org:443": 1


      - id: ds-catalog-route
        uris:
          - "/catalog"
          - "/catalog/*"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        upstream:
          type: roundrobin
          scheme: http
          nodes:
            "ds-catalog.hus.svc.cluster.local:8081": 10
          timeout:
            connect: 10
            send: 30
            read: 30
          checks:
            active:
              http_path: "/health-check/"  # Health check endpoint with trailing slash
              healthy:
                interval: 5
                successes: 1
              unhealthy:
                interval: 5
                http_failures: 2
        plugins:
          proxy-rewrite:
            regex_uri: ["^/catalog(/.*)?$", "$1"]  # Strip /catalog prefix  
          limit-req:
            rate: 500
            burst: 200
            key: remote_addr     
          proxy-timeout:
            timeout: 30000

      - id: ds-search-route
        uris:
          - "/search"
          - "/search/*"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        upstream:
          type: roundrobin
          scheme: http
          nodes:
            "ds-search.hus.svc.cluster.local:8080": 10
          timeout:
            connect: 10
            send: 30
            read: 30
          checks:
            active:
              http_path: "/health-check"  # Health check endpoint (no trailing slash for search)
              healthy:
                interval: 5
                successes: 1
              unhealthy:
                interval: 5
                http_failures: 2
        plugins:
          proxy-rewrite:
            regex_uri: ["^/search(/.*)?$", "$1"]  # Strip /search prefix
          limit-req:
            rate: 500
            burst: 200
            key: remote_addr     
          proxy-timeout:
            timeout: 30000

      - id: ds-connector-route
        uris:
          - "/connector"
          - "/connector/*"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        upstream:
          type: roundrobin
          scheme: http
          nodes:
            "ds-connector.hus.svc.cluster.local:7000": 10
          timeout:
            connect: 10
            send: 30
            read: 30
          checks:
            active:
              http_path: "/health-check"  # Health check endpoint (no trailing slash for search)
              healthy:
                interval: 5
                successes: 1
              unhealthy:
                interval: 5
                http_failures: 2
        plugins:
          proxy-rewrite:
            regex_uri: ["^/connector(/.*)?$", "$1"]  # Strip /connector prefix
            decode_uri: true
          limit-req:
            rate: 500
            burst: 200
            key: remote_addr
          proxy-timeout:
            timeout: 30000

      # ─── Identity + auth stack (M36 single-site demo) ───

      - id: ds-login-route
        uris:
          - "/login"
          - "/login/*"
          # ds-login's JWKs discovery endpoint is served from the root; keep
          # it reachable at /login/.well-known/jwks.json after the prefix
          # strip so downstream services can set DS__AUTH__JWKS_URL to the
          # same URL whether they call it in-cluster or through the gateway.
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        upstream:
          type: roundrobin
          scheme: http
          nodes:
            "ds-login.hus.svc.cluster.local:8080": 10
          timeout:
            connect: 10
            send: 30
            read: 30
          checks:
            active:
              http_path: "/health-check/"
              healthy:
                interval: 5
                successes: 1
              unhealthy:
                interval: 5
                http_failures: 2
        plugins:
          proxy-rewrite:
            regex_uri: ["^/login(/.*)?$", "$1"]  # Strip /login prefix
          limit-req:
            # Tighter than catalog — brute-forcing credentials is the attack.
            rate: 60
            burst: 30
            key: remote_addr
          proxy-timeout:
            timeout: 30000

      - id: ds-credential-issuer-route
        uris:
          - "/credential-issuer"
          - "/credential-issuer/*"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        upstream:
          type: roundrobin
          scheme: http
          nodes:
            "ds-credential-issuer.hus.svc.cluster.local:8080": 10
          timeout:
            connect: 10
            send: 30
            read: 30
          checks:
            active:
              http_path: "/health-check/"
              healthy:
                interval: 5
                successes: 1
              unhealthy:
                interval: 5
                http_failures: 2
        plugins:
          proxy-rewrite:
            regex_uri: ["^/credential-issuer(/.*)?$", "$1"]  # Strip /credential-issuer prefix
          limit-req:
            # Minting ACDCs is a privileged, infrequent operation.
            rate: 30
            burst: 15
            key: remote_addr
          proxy-timeout:
            timeout: 30000

      - id: ds-policy-engine-route
        uris:
          - "/policy-engine"
          - "/policy-engine/*"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        upstream:
          type: roundrobin
          scheme: http
          nodes:
            "ds-policy-engine.hus.svc.cluster.local:8000": 10
          timeout:
            connect: 10
            send: 30
            read: 30
          checks:
            active:
              http_path: "/health"
              healthy:
                interval: 5
                successes: 1
              unhealthy:
                interval: 5
                http_failures: 2
        plugins:
          proxy-rewrite:
            regex_uri: ["^/policy-engine(/.*)?$", "$1"]  # Strip /policy-engine prefix
          limit-req:
            # /evaluate is the hot path — every gated request hits it.
            # Keep the rate catalog-tier.
            rate: 500
            burst: 200
            key: remote_addr
          proxy-timeout:
            timeout: 30000
    #END
