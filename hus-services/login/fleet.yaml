defaultNamespace: hus
# No dependsOn on DKMS — if DKMS is broken, we want ds-login to install
# and crashloop with a visible error (OOBI resolve / watcher ping) rather
# than silently never deploy. The service tolerates a transient DKMS
# outage via its own retry loop; Kubernetes readiness probes handle the
# cold-start race once DKMS comes up.
helm:
  repo: https://hiro-microdatacenters-bv.github.io/ds-login
  chart: ds-login
  releaseName: ds-login
  version: 0.1.7
  valuesFiles:
    - values.yaml
