# HUS ds-login deploy.
# Issues short-lived RS256 JWTs after verifying a user's challenge signature
# + their presented IPEX credential grant. The JWTs are consumed by every
# other ds-* service via ds-auth.

image:
  # Pinned to the versioned SHA tag ds-login CI now publishes alongside
  # 'develop' and 'main' (format: <appVersion>-dev.<run>.<branch>.<short-sha>).
  # Matches the pattern used by every other ds-* service; combined with
  # pullPolicy: IfNotPresent this means pod restarts hit the local
  # containerd cache instead of ghcr's anonymous token endpoint.
  tag: "0.1.0-dev.121.develop.8c4f2bb3"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# Per-service ingress alongside the gateway route. The gateway route
# (hus-services/gateway/values.yaml, /login/*) covers Hiro-internal callers.
# The per-service ingress gives external verifiers, partner-site federations
# and standards-based JWT libraries the OIDC-conventional URL:
#   https://ds-login.hus.nextgen.hiro-develop.nl/.well-known/jwks.json
#
# cert-manager mints a per-host Let's Encrypt cert into
# `ds-login-tls-secret` (requires chart 0.1.3+ for annotations support).
# Same pattern as ds-policy-engine.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ds-login.hus.nextgen.hiro-develop.nl
  tls:
    enabled: true
    secretName: ds-login-tls-secret

# Point at HUS's DKMS stack. In-cluster Service DNS — matches ds-dkms
# chart service names in the hus namespace.
# Watcher is used for liveness probing at /login/challenge; witnesses are a
# fallback path. The main verify flow pulls OOBIs from each incoming grant,
# not from this static list.
dkms:
  watcherUrl: http://ds-dkms-watcher:3235
  witnessUrls:
    - http://ds-dkms-witness:3232

jwt:
  issuer: ds-login
  audience: hiro-services
  ttlSeconds: 900
  # Persistent RSA signing key. ds-login refuses to start with
  # environment=production unless this is set (or the inline-PEM env var).
  # Secret was generated out-of-band with openssl + kubectl create secret
  # (see ops/ds-login-signing-key.md for the one-shot command). Rotate by
  # recreating the Secret and restarting the pod — JWTs issued under the
  # old key stay valid until TTL (900s).
  signingKeySecretName: "ds-login-jwt-signing-key"
  signingKeySecretField: private.pem

environment: production
logLevel: INFO

# Rahul audit #1 — trusted-issuer allowlist. Without this entry
# ds-login refuses to start in production (fail-safe default). The
# listed AID is the HUS ds-credential-issuer's bootstrap AID,
# visible at startup via:
#   kubectl -n hus exec deploy/ds-credential-issuer \
#     -- dkms identifier info hus-issuer
# Rotate this list whenever the issuer identity rotates (new PVC,
# fresh init, keystore wipe). A missing entry → every grant minted
# by that issuer rejected at verify time with 'issuer not on trusted
# allowlist'.
trustedIssuerAids:
  - EJ5WvuqwnfTfSZ-bx26NTEgslUp5Bnw2Fbja_P5I8_O1

nodeSelector:
  role: hus
