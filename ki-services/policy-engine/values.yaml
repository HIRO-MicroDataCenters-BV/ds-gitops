# KI ds-policy-engine deploy (same shape as hus-services/policy-engine).
# Evaluates per-request permission decisions. Every other ds-* service calls
# POST /api/v1/policies/evaluate (public endpoint, no auth) to resolve what
# the caller is allowed to do; the service's own admin surface (/rules etc.)
# is gated by ds-auth when DS__AUTH_ENABLED=true.

namespace: ki

nodeSelector:
  role: ki

replicaCount: 1

image:
  repository: ghcr.io/hiro-microdatacenters-bv/ds-policy-engine
  # Chart's appVersion sets a sensible default; leave empty to let the chart pick.
  tag: "0.1.0-dev.39.main.1a7f1ec7"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

# Per-service ingress alongside the gateway route. This chart already
# supports annotations natively (no bump needed). Restores the pre-PR-#35
# accessibility pattern the old 6-month-old deploy had.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ds-policy-engine.ki.nextgen.hiro-develop.nl
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ds-policy-engine-tls-secret

persistence:
  enabled: true
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  mountPath: /app/data

env:
  logLevel: INFO
  # DS__NODE_NAME intentionally omitted — chart defaults it to the namespace.

# With Option B the UI calls the backend same-origin through its nginx proxy,
# so no browser ever hits this backend directly and CORS is not needed.
cors:
  allowedOrigins: ""

# Swagger UI is on by default — /docs, /redoc, /openapi.json are reachable.
# Will be flipped off explicitly later (e.g. once ds-gateway fronts the
# service or the API surface goes sensitive). Until then, leave on.
docs:
  enabled: true

dbQuery:
  # /api/v1/db/query is a data-exfiltration surface. Keep OFF in prod.
  enabled: false

# OPA (Open Policy Agent) runs as a sidecar inside the policy-engine pod
# and evaluates the compiled Rego rules at request time. Keep on — the
# backend depends on it.
opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    tag: "1.2.0"

# ds-auth wiring injected as extra env — the chart doesn't template these
# directly (yet), so we use the extraEnv escape hatch. Default DISABLED
# here: flip to "true" after ds-login is confirmed running + JWKs reachable
# from this namespace. One-line change.
extraEnv:
  - name: DS__AUTH_ENABLED
    value: "false"
  - name: DS__AUTH_JWKS_URL
    value: "http://ds-login:8080/.well-known/jwks.json"
  - name: DS__AUTH_JWT_ISSUER
    value: "ds-login"
  - name: DS__AUTH_JWT_AUDIENCE
    value: "hiro-services"
  - name: DS__AUTH_POLICY_ENGINE_URL
    # Self-reference: /api/v1/policies/evaluate is on PUBLIC_PATHS, so this
    # does not loop through auth.
    value: "http://localhost:8000"

# role@site rules for KI (institute = site name). A Job loads them after every
# deploy and REPLACES all rules in the engine: rules added in the UI are lost
# on the next deploy. Change rules here, not in the UI. (Replaces the old
# catalog_owner/creator/consumer rules, dropped on 29 Oct 2026.)
# The loader calls the import API without a token, so it needs
# DS__AUTH_ENABLED=false above; give it a token before turning auth on.
rules:
  - name: site-admin-ki
    role: site_admin
    institute: ki
    description: Runs the site; may do everything
    permissions: [issuer:write, issuer:read, rules:admin, catalog:read, catalog:write, decentralized-search:execute, federated-learning:execute]
  - name: operator-ki
    role: operator
    institute: ki
    description: Issues and revokes data_provider and researcher credentials
    permissions: [issuer:write, issuer:read]
  - name: data-provider-ki
    role: data_provider
    institute: ki
    description: Publishes datasets in this site's catalog
    permissions: [catalog:read, catalog:write]
  - name: researcher-ki
    role: researcher
    institute: ki
    description: Finds, uses and publishes data
    permissions: [catalog:read, catalog:write, decentralized-search:execute, federated-learning:execute]
