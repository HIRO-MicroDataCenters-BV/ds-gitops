env:
  - name : LOG_LEVEL
    value: "INFO"

  - name: ORDER_TTL_SECONDS
    value: "7200" # 120 minutes
  - name: ORDER_KEY_PREFIX
    value: "order:"  # Prefix for order keys in storage
  - name: ORDER_TTL_ENABLED
    value: "true"
  - name: MAX_PAYLOAD_SIZE_BYTES
    value: "10485760" # 10 MB
  - name:  DS_CONNECTOR_BASE_URL
    value: "https://ds-connector.{region}.nextgen.hiro-develop.nl/distribution-content"
  # Contracts for orders (generation only; nothing validates them yet). After
  # storing an order, checkout asks each region's contract generator for a
  # contract covering that region's datasets; it shows on that site's
  # Contracts page. Only HUS has a generator, so ki/uva datasets get none.
  # Best effort: an order is stored even when no contract can be made.
  # node_id must equal the generator's DS__NODE_ID.
  - name: CONTRACT_GENERATORS
    value: '{"hus": {"url": "http://ds-contract-generator.hus.svc.cluster.local:8082", "node_id": "hus.nextgen.hiro-develop.nl"}}'
  # Consumer named in a contract when the order carries no ds-login token
  # (the website passes the signed-in user's token; read, not verified).
  - name: CONTRACT_DEFAULT_CONSUMER_ID
    value: "unknown@local"


  - name: DATABASE__PROTOCOL
    value: "redis"
  - name: DATABASE__HOST
    value: "redis-repository"
  - name: DATABASE__PORT
    value: "6379"
  - name: DATABASE__DB_NUMBER
    value: "0"
  - name: DATABASE__USERNAME
    value: ""
  - name: DATABASE__PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-credentials
        key: password

  - name: TEST_DATABASE__PROTOCOL
    value: "redis"
  - name: TEST_DATABASE__HOST
    value: "redis-repository"
  - name: TEST_DATABASE__PORT
    value: "6379"
  - name: TEST_DATABASE__DB_NUMBER
    value: "15"
  - name: TEST_DATABASE__USERNAME
    value: ""
  - name: TEST_DATABASE__PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-credentials
        key: password

ingress:
  enabled: true
  host: nextgen.hiro-develop.nl
  
nodeSelector:
  role: marketplace

namespace: marketplace

metrics:
  enabled: true